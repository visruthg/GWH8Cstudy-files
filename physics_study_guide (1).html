<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics 11.1–12.3 Study Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#f6efe1; --card:#fffaf0; --text:#3a2f22; --muted:#8a7a63;
    --border:#e7d9bd; --accent:#b8892b; --accent2:#a44b3f;
    --accent-soft:#f1e3c4; --accent2-soft:#f3ded6;
    --correct:#5c7a3a; --incorrect:#a44b3f;
    --shadow: 0 2px 14px rgba(120,90,40,0.10);
    --gold:#c9971f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: "Segoe UI", Avenir, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(201,151,31,0.06), transparent 40%),
      radial-gradient(circle at 90% 30%, rgba(164,75,63,0.05), transparent 40%);
  }
  .wrap{max-width:980px; margin:0 auto; padding:20px 16px 100px;}
  header.top{
    text-align:center; padding:22px 10px 10px;
  }
  header.top h1{ font-size:1.7rem; margin:0 0 4px; letter-spacing:-0.02px; color:var(--accent2);}
  header.top p{ color:var(--muted); margin:0; font-size:0.95rem;}
  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding:16px 2px 6px;
    scrollbar-width:thin;
  }
  .tab{
    flex:0 0 auto; border:1px solid var(--border); background:var(--card);
    color:var(--text); padding:9px 14px; border-radius:999px; cursor:pointer;
    font-size:0.85rem; font-weight:600; white-space:nowrap;
    transition:all .15s ease;
  }
  .tab .num{
    display:inline-block; font-size:0.72rem; opacity:0.65; margin-right:5px;
  }
  .tab.active{ background:var(--accent); border-color:var(--accent); color:white;}
  .tab.done::after{ content:" ✓"; opacity:0.8; }

  .panel{ display:none; animation: fade .25s ease; }
  .panel.active{ display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-head{
    display:flex; align-items:center; gap:12px; margin: 6px 0 16px;
  }
  .badge{
    background:var(--accent); color:#fff; font-weight:800; font-size:1rem;
    border-radius:12px; padding:8px 12px; flex:0 0 auto;
  }
  .badge.energy{ background:var(--accent2); }
  .section-head h2{ margin:0; font-size:1.3rem; }
  .section-head .obj{ color:var(--muted); font-size:0.85rem; margin-top:2px;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card h3{ margin-top:0; font-size:1.02rem; }
  .card p{ line-height:1.6; font-size:0.95rem; color:var(--text); }
  .card ul{ line-height:1.6; font-size:0.95rem; padding-left:20px; }

  span.inline-fig{
    display:block; margin: 4px 0 14px 18px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
    float:right; width:230px; max-width:42%;
  }
  span.inline-fig.left{ float:left; margin:4px 18px 14px 0; }
  span.inline-fig img{ width:100%; display:block; object-fit:cover; background:#eee;}
  span.inline-fig span.cap{ font-size:0.75rem; color:var(--muted); padding:8px 10px; line-height:1.35; font-style:italic; display:block;}
  @media (max-width:640px){
    span.inline-fig{ float:none; width:100%; max-width:100%; margin:10px 0; }
  }
  .clearfix{ clear:both; }
  .card.clearfix::after{ content:""; display:table; clear:both; }

  .gallery-strip{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; margin:14px 0;
  }
  .gallery-strip figure{ margin:0; background:var(--card); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  .gallery-strip img{ width:100%; display:block; height:120px; object-fit:cover; background:#eee;}
  .gallery-strip figcaption{ font-size:0.74rem; color:var(--muted); padding:7px 9px; line-height:1.3;}

  .keypoints{
    background:var(--accent-soft); border:1px solid var(--border);
    border-radius:14px; padding:14px 18px; margin-bottom:14px;
  }
  .keypoints h3{ margin-top:0; color:var(--accent2); font-size:0.98rem;}
  .keypoints ul{ margin:0; padding-left:20px; font-size:0.9rem; line-height:1.6;}

  .practice-title{
    display:flex; align-items:center; justify-content:space-between;
    margin: 22px 0 10px;
  }
  .practice-title h3{ margin:0; font-size:1.05rem; color:var(--accent2); }
  .score-pill{
    font-size:0.78rem; background:var(--card); border:1px solid var(--border);
    padding:5px 11px; border-radius:999px; color:var(--muted); font-weight:600;
  }

  .q{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .q .qtext{ font-size:0.94rem; font-weight:600; margin-bottom:10px; line-height:1.5;}
  .q .qtext .qn{ color:var(--accent); margin-right:5px;}
  .opts{ display:flex; flex-direction:column; gap:7px; }
  .opt{
    text-align:left; padding:9px 12px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--text); font-size:0.88rem; cursor:pointer;
    transition:background .15s;
  }
  .opt:hover{ background:var(--accent-soft); }
  .opt.correct{ background:var(--correct); border-color:var(--correct); color:white; }
  .opt.incorrect{ background:var(--incorrect); border-color:var(--incorrect); color:white; }
  .opt[disabled]{ cursor:default; }
  .feedback{ margin-top:9px; font-size:0.85rem; padding:9px 11px; border-radius:9px; display:none; line-height:1.5;}
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--accent-soft); color:var(--correct); }
  .feedback.bad{ background:var(--accent2-soft); color:var(--incorrect); }

  .reveal-btn{
    border:1px solid var(--accent); color:var(--accent); background:transparent;
    padding:7px 13px; border-radius:9px; font-size:0.83rem; font-weight:600; cursor:pointer;
  }
  .reveal-box{
    margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--accent-soft);
    font-size:0.87rem; line-height:1.5; display:none;
  }
  .reveal-box.show{ display:block; }

  .calc-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;}
  .calc-row input{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:0.88rem;
    width:120px; background:var(--bg); color:var(--text);
  }
  .calc-row button{
    border:none; background:var(--accent); color:white; padding:8px 14px; border-radius:8px;
    font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  .fill-blanks input{
    border:none; border-bottom:2px solid var(--accent); background:transparent;
    color:var(--text); font-size:0.9rem; width:110px; text-align:center; font-weight:600;
  }

  .nav-buttons{ display:flex; justify-content:space-between; margin-top:22px; gap:10px;}
  .nav-buttons button{
    border:1px solid var(--border); background:var(--card); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:0.88rem; font-weight:600; cursor:pointer;
    flex:1;
  }
  .nav-buttons button.primary{ background:var(--accent); border-color:var(--accent); color:white; }
  .nav-buttons button:disabled{ opacity:0.4; cursor:default;}

  footer.credit{ text-align:center; color:var(--muted); font-size:0.75rem; margin-top:30px;}

  /* ---------- Annotation marks ---------- */
  mark.hl{ padding:0 1px; border-radius:2px; cursor:pointer; }
  span.note-anno{ cursor:pointer; border-bottom:3px solid; padding-bottom:1px; }
  span.note-anno::after{
    content:"📝"; font-size:0.7em; vertical-align:super; margin-left:1px; opacity:0.8;
  }

  /* ---------- Annotation toolbar ---------- */
  #anno-toolbar{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 6px 22px rgba(120,90,40,0.22);
    padding:9px 12px; display:flex; align-items:center; gap:10px; z-index:999;
    flex-wrap:wrap; justify-content:center; max-width:94vw;
  }
  #anno-toolbar .mode-btn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    padding:7px 11px; border-radius:10px; font-size:0.8rem; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  #anno-toolbar .mode-btn.active{ background:var(--accent); border-color:var(--accent); color:white; }
  #anno-toolbar .swatches{ display:flex; gap:6px; }
  #anno-toolbar .swatch{
    width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  #anno-toolbar .swatch.active{ border-color:var(--text); transform:scale(1.15); }
  #anno-toolbar .clear-btn{
    border:1px solid var(--incorrect); color:var(--incorrect); background:transparent;
    padding:7px 11px; border-radius:10px; font-size:0.78rem; font-weight:600; cursor:pointer;
  }
  #anno-toolbar .hint{ font-size:0.72rem; color:var(--muted); }
  .annotatable{ position:relative; }

  @media (max-width:600px){
    #anno-toolbar{ gap:7px; padding:8px 9px; }
    #anno-toolbar .hint{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>⚛️ Physics Study Guide</h1>
    <p>Sections 11.1 – 12.3 · Forces (floating &amp; density) and Energy (heat &amp; conduction)</p>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <footer class="credit">Based on Cambridge Lower Secondary Complete Physics, Stage 9 · Chapters 11–12</footer>
</div>

<div id="anno-toolbar">
  <button class="mode-btn active" id="mode-highlight" onclick="setMode('highlight')">🖍️ Highlight</button>
  <button class="mode-btn" id="mode-note" onclick="setMode('note')">📝 Note</button>
  <div class="swatches" id="swatches"></div>
  <span class="hint" id="tool-hint">Select text to highlight</span>
  <button class="clear-btn" onclick="clearAllAnnotations()">Clear all</button>
</div>

<script>
/* ---------------- CONTENT DATA ---------------- */
const SECTIONS = [
  {
    id: "s111",
    num: "11.1",
    title: "Floating and sinking",
    chapter: "forces",
    objective: "Explain why some things float and some things sink in water",
    introHtml: `
      <p><span class="inline-fig-slot" data-key="iceberg"></span>Icebergs can have a mass of more than 100,000 tonnes — the same as over 50,000 cars — yet they float. An object floats on a liquid if it is <strong>less dense</strong> than that liquid. We calculate density using:</p>
      <p style="text-align:center;font-size:1.05rem;"><strong>density = mass ÷ volume</strong></p>
      <p>For example, a coconut with mass 400&nbsp;g and volume 500&nbsp;cm³ has a density of 400 ÷ 500 = <strong>0.8 g/cm³</strong>. Since this is less than the density of water (1.0 g/cm³), the coconut floats. It isn't always easy to predict whether something will float or sink just by what it's made of — pumice is a volcanic rock that floats (density about 0.3 g/cm³), while ironwood, an unusually dense type of wood, actually sinks.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot left" data-key="pumice"></span>Floating can also be explained using <strong>upthrust</strong>: particles in a liquid collide with an object from below, and particles in the air collide with it from above. An object floats if the upthrust equals its weight. Denser liquids exert a bigger upthrust because their particles are more massive — that's why it's much easier to float in salt water than in a swimming pool, or in the Dead Sea.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot" data-key="deadsea"></span>Ice is made of water, so how can it float on water? When water freezes, its molecules form a solid structure that takes up <em>more</em> space than the liquid — so ice is actually less dense than liquid water. This is unusual: most solids are denser than their liquids.</p>
      <div class="clearfix"></div>
      <p>Compare the arrangement of particles below: in liquid water they can move past each other, but in solid ice they lock into a more open, spaced-out structure — this extra space is exactly why ice is less dense than water and floats on it.</p>
      <div class="gallery-strip">
        <figure><img data-imgkey="moleculeswater" alt=""><figcaption>Particles in liquid water can move past each other.</figcaption></figure>
        <figure><img data-imgkey="moleculesice" alt=""><figcaption>Particles in ice form a more open, spaced-out structure.</figcaption></figure>
      </div>
    `,
    keypoints: [
      "An object will float on water if it is less dense than water.",
      "Objects float because liquids exert a force on them, called upthrust.",
      "Collisions of liquid and gas particles produce upthrust."
    ],
    questions: [
      {
        type:"reveal",
        q:"Explain why a person floats in a swimming pool in terms of density.",
        a:"A person floats because their overall body density is less than the density of the pool water. The upthrust from the water pushing up equals the person's weight pushing down, so they float."
      },
      {
        type:"calc",
        q:"An object has a mass of 100 g and a volume of 90 cm³. Calculate its density, then state whether it would float or sink in water (density of water = 1.0 g/cm³).",
        answer: 1.11,
        tolerance: 0.05,
        unit:"g/cm³",
        explain:"density = mass ÷ volume = 100 ÷ 90 ≈ 1.11 g/cm³. Since 1.11 g/cm³ is greater than water's density (1.0 g/cm³), the object would sink."
      },
      {
        type:"mcq",
        q:"A submarine can dive below the surface and later return to it. What must happen for it to dive?",
        options:[
          "It takes in water to increase its overall density above that of seawater",
          "It heats its outer hull so the metal expands and becomes denser",
          "It removes all the air from inside completely and permanently",
          "It increases its speed so upthrust can no longer act on it"
        ],
        correct:0,
        explain:"A submarine takes on water in its ballast tanks, increasing its overall density above that of the surrounding seawater, so it sinks. To resurface, it pumps the water back out, lowering its density below that of seawater."
      }
    ]
  },
  {
    id:"s112",
    num:"11.2",
    title:"Using ideas about density",
    chapter:"forces",
    objective:"Describe how ideas about density have been used, and how scientists worked in the past and today",
    introHtml: `
      <p><span class="inline-fig-slot" data-key="gems"></span><strong>Gemstones</strong> are minerals found in the Earth that have distinctive colours — but quartz and glass can easily be mistaken for real gemstones. For thousands of years people have prized jewellery made from gold, rubies, and emeralds.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot left" data-key="albiruni"></span>Over 1000 years ago, <strong>Al-Biruni</strong>, a scientist and mathematician, worked out how to identify gemstones by measuring their density precisely. He designed a special flask with a side arm to measure a stone's volume accurately, even though the stones had irregular shapes.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot" data-key="flask"></span>His method: fill the flask until water overflows through the side arm into a beaker, empty and replace the beaker, lower the stone into the flask, then measure the volume of water that overflows. Al-Biruni also classified gemstones by colour, how light splits into a spectrum through them, hardness, and crystal shape. It took over 700 years before scientists in Europe reached the same level of precision.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot left" data-key="quartz"></span>Quartz — the most common mineral on Earth — and rough diamond can be hard to tell apart just by looking at them, which is exactly the kind of problem Al-Biruni's density method could solve.</p>
      <div class="clearfix"></div>
      <p><span class="inline-fig-slot" data-key="scienceteam"></span>Today, scientists can also use a gem's <strong>refractive index</strong> or how well it conducts electricity to identify it — and modern science is usually done by teams that share their work in publications, rather than by individuals working alone.</p>
    `,
    keypoints:[
      "Density can be used to identify materials.",
      "In the past, most scientists worked alone.",
      "Today, most science is done by teams of people.",
      "Today, as in the past, scientists build on the work of other scientists."
    ],
    questions:[
      {
        type:"reveal",
        q:"Explain why Al-Biruni wanted to find a method to measure the density of gemstones.",
        a:"So that people could tell whether a stone was a genuine, valuable gemstone or a cheaper look-alike such as quartz or glass — quartz could easily be mistaken for a diamond, and people could be tricked into paying a lot of money for it."
      },
      {
        type:"reveal",
        q:"Describe one way Al-Biruni's way of working was similar to how scientists work today, and one way it was different.",
        a:"Similar: he built on the ideas and measurements of earlier scientists, and designed careful, precise techniques to get accurate results. Different: he largely worked alone, whereas today's scientists usually specialise in one area and work in teams, sharing results with people all over the world through publications."
      },
      {
        type:"reveal",
        q:"Suggest why scientists did not improve on the precision of Al-Biruni's density measurements for hundreds of years.",
        a:"Possible reasons include: his results and methods may not have spread widely to other regions; equipment and measuring techniques did not improve much during that time; or later scientists were not building directly on his specific work until it became more widely known."
      }
    ]
  },
  {
    id:"s113",
    num:"11.3",
    title:"Review: Forces",
    chapter:"forces",
    objective:"Practise density calculations and float/sink predictions",
    introHtml:`<p>Use this table of densities to answer the review questions:</p>
      <table style="width:100%;border-collapse:collapse;font-size:0.88rem;margin:10px 0;">
        <tr style="background:var(--accent);color:white;"><th style="padding:6px;text-align:left;">Material</th><th style="padding:6px;text-align:left;">Density (g/cm³)</th></tr>
        <tr><td style="padding:6px;border-bottom:1px solid var(--border);">Air</td><td style="padding:6px;border-bottom:1px solid var(--border);">0.001</td></tr>
        <tr><td style="padding:6px;border-bottom:1px solid var(--border);">Ice</td><td style="padding:6px;border-bottom:1px solid var(--border);">0.9</td></tr>
        <tr><td style="padding:6px;border-bottom:1px solid var(--border);">Iron</td><td style="padding:6px;border-bottom:1px solid var(--border);">7.9</td></tr>
        <tr><td style="padding:6px;border-bottom:1px solid var(--border);">Plastic</td><td style="padding:6px;border-bottom:1px solid var(--border);">1.4</td></tr>
        <tr><td style="padding:6px;border-bottom:1px solid var(--border);">Wood</td><td style="padding:6px;border-bottom:1px solid var(--border);">0.7</td></tr>
        <tr><td style="padding:6px;">Water</td><td style="padding:6px;">1.0</td></tr>
      </table>`,
    keypoints: [
      "Volume of a cuboid = length × width × height.",
      "Density = mass ÷ volume — always compare with the liquid's density to predict floating or sinking.",
      "Fish use a swim bladder filled with gas to control their overall density and depth.",
      "Good scientific planning includes deciding what to measure and how to work safely — not just recording results."
    ],
    questions:[
      {
        type:"calc",
        q:"A brick measures 20 cm × 10 cm × 6 cm. Calculate its volume in cm³.",
        answer: 1200,
        tolerance: 1,
        unit:"cm³",
        explain:"volume = length × width × height = 20 × 10 × 6 = 1200 cm³."
      },
      {
        type:"calc",
        q:"The same brick has a mass of 2.4 kg (2400 g). Calculate its density in g/cm³ (using the 1200 cm³ volume from before).",
        answer: 2.0,
        tolerance: 0.05,
        unit:"g/cm³",
        explain:"density = mass ÷ volume = 2400 g ÷ 1200 cm³ = 2.0 g/cm³. This is greater than water's density (1.0 g/cm³), so the brick would sink."
      },
      {
        type:"mcq",
        q:"Using the density table above, which solid material would float in water but sink in mercury (density 13.6 g/cm³)?",
        options:["Iron (7.9 g/cm³)","Wood (0.7 g/cm³)","Both iron and wood","Neither iron nor wood"],
        correct:2,
        explain:"Both iron (7.9) and wood (0.7) are less dense than mercury (13.6), so both float in mercury. Only wood (0.7) is less dense than water (1.0), so wood floats in water while iron sinks in water — but the question asks about mercury, where both float."
      },
      {
        type:"reveal",
        q:"A fish can move up and down in the water using a swim bladder filled with oxygen from its gills. Explain why filling the sac would let it float upwards.",
        a:"Filling the swim bladder with gas increases the fish's overall volume without adding much mass, which lowers its overall (average) density. Once its density becomes less than the water's density, the fish experiences more upthrust than weight and rises."
      },
      {
        type:"mcq",
        q:"You are planning an investigation into density. Which of these is NOT something you should do as part of the planning stage?",
        options:[
          "Decide on a question to investigate",
          "Work out how to take precise and accurate measurements",
          "Write down what you found out",
          "Decide which measurements to make"
        ],
        correct:2,
        explain:"Writing down what you found out happens during or after the investigation, not during planning. Planning involves deciding the question, the measurements to take, and how to work safely and accurately."
      },
      {
        type:"reveal",
        q:"A Galileo thermometer uses small glass bulbs containing different densities of liquid and air. As temperature drops, bulbs move upwards. Suggest why.",
        a:"As the temperature drops, the liquid in the thermometer's tube contracts and becomes denser. This changes the balance between the weight of each bulb and the upthrust acting on it, so more bulbs are able to float upwards as the surrounding liquid's density increases with falling temperature."
      }
    ]
  },
  {
    id:"s121",
    num:"12.1",
    title:"Hot and cold",
    chapter:"energy",
    objective:"Describe the difference between heat and temperature, and define heat dissipation",
    introHtml:`
      <p><span class="inline-fig-slot" data-key="scorpion"></span><strong>Temperature</strong> tells us how hot or cold something is, measured in <strong>degrees Celsius (°C)</strong> using a thermometer. Temperature and energy are <em>not</em> the same thing — a cup of warm water and a swimming pool can be at exactly the same temperature, but the pool has far more energy stored in it because it has many more particles.</p>
      <p>Heating a substance transfers energy to it and its particles move or vibrate faster: in solids, particles vibrate more; in liquids and gases, particles move faster. The energy needed to raise an object's temperature depends on its <strong>mass</strong>, its <strong>material</strong>, and the <strong>temperature rise</strong> needed.</p>
      <p><span class="inline-fig-slot left" data-key="iceglass"></span>Energy always transfers from a hot object to a cold object — this is called <strong>dissipation</strong>. When a hot object and cold object reach the same temperature, they are in <strong>thermal equilibrium</strong>. When ice is put into water, energy transfers from the water to the ice, so the ice melts and the water cools.</p>
    `,
    keypoints:[
      "Temperature is a measure of how hot something is, measured in degrees Celsius.",
      "Thermometers are used to measure temperature.",
      "When you heat a solid, liquid, or gas, the particles move faster or vibrate more.",
      "Energy is dissipated when it moves from a hot to a cold region."
    ],
    questions:[
      {
        type:"reveal",
        q:"Describe the difference between temperature and energy.",
        a:"Temperature tells us how hot or cold something is. Energy is the total amount stored in an object's thermal store, which depends on the mass and material of the object as well as its temperature — two objects can be at the same temperature but hold very different amounts of energy."
      },
      {
        type:"fillblank",
        q:"Complete: When you heat a liquid, the particles in it move _____. The same happens when you heat a gas. When you heat a solid, the particles just vibrate more. Dissipation is when energy moves from a _____ to a _____ region.",
        blanks:["faster","hot","cold"],
        explain:"Heating liquids and gases makes their particles move faster; heating a solid makes its particles vibrate more. Energy always dissipates from a hot region to a cold region."

      <p><span class="inline-fig-slot" data-key="energydiagram"></span>The <strong>law of conservation of energy</strong> says that energy cannot be created or destroyed — it can only be transferred from one place, or one form, to another. If you know how much energy you start with, you have the same total amount at the end of a process.</p>
      <p>When a light bulb is switched on, some energy is transferred usefully as <strong>light</strong>, and some is <strong>wasted</strong>, heating the surroundings. Energy that is dissipated is usually wasted energy — though not always: when cooking food, the heat is useful, but some heats the surrounding air unnecessarily, which is wasted.</p>
      <p><span class="inline-fig-slot left" data-key="bulb"></span>A device is more <strong>efficient</strong> if more of the energy you put in is transferred as useful energy, and less is wasted. Energy-efficient light bulbs transfer more of their energy into light and less into heating the surroundings than old-style bulbs — you can see this clearly in a thermal image, where the efficient bulb on the left stays much cooler than the normal bulb on the right.</p>

    introHtml:`
      <p><span class="inline-fig-slot" data-key="conduction"></span>Energy is transferred through a solid by <strong>conduction</strong>. Metals, like copper, are very good thermal <strong>conductors</strong> — that's why cooking pans are often made of metal. Many non-metals, such as paper, cloth, wood, and plastic, are poor conductors — these are called <strong>insulators</strong>.</p>
      <p>In a metal being heated at one end, particles vibrate more at the hot end; electrons also move through the metal, transferring energy from the hot end to the cold end.</p>
      <p><span class="inline-fig-slot left" data-key="diver"></span>Liquids and gases that are free to flow can transfer energy by convection, but if they are trapped and cannot move (like air in a padded jacket, or a near-vacuum between double-glazed window panes), they are excellent insulators, because their particles are far apart and rarely collide. An ice cube held down in a test tube of boiling water won't melt quickly, because liquid water is a poor conductor.</p>
      <p>Objects can feel hot or cold at the very same room temperature — your skin detects the <em>transfer</em> of energy, not the actual temperature. Metal feels cold because it conducts energy away from your hand quickly; plastic feels warmer because it conducts energy away much more slowly.</p>

<script>
/* ---------------- APP LOGIC ---------------- */
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
let currentIndex = 0;
const sectionScores = {};

function buildInlineFigures(html){
  // replace <span class="inline-fig-slot [left]" data-key="x"></span> with actual figure markup
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('.inline-fig-slot').forEach(slot=>{
    const key = slot.getAttribute('data-key');
    const isLeft = slot.classList.contains('left');
    const fig = document.createElement('span');
    fig.className = 'inline-fig' + (isLeft ? ' left' : '');
    const img = document.createElement('img');
    img.setAttribute('data-imgkey', key);
    img.alt = IMG_CAPTIONS[key] || '';
    const capEl = document.createElement('span');
    capEl.className = 'cap';
    capEl.textContent = IMG_CAPTIONS[key] || '';
    fig.appendChild(img);
    fig.appendChild(capEl);
    slot.replaceWith(fig);
  });
  return div.innerHTML;
}

SECTIONS.forEach((s,i)=>{
  sectionScores[s.id] = {correct:0, total: s.questions.filter(q=>q.type==='mcq'||q.type==='calc'||q.type==='fillblank').length, answered:0};

  const tab = document.createElement('button');
  tab.className = 'tab' + (i===0?' active':'');
  tab.id = 'tab-'+s.id;
  tab.innerHTML = `<span class="num">${s.num}</span>${s.title}`;
  tab.onclick = ()=> showPanel(i);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0?' active':'');
  panel.id = 'panel-'+s.id;

  const questionsHtml = s.questions.map((q,qi)=> renderQuestion(s.id, q, qi)).join('');
  const introBuilt = buildInlineFigures(s.introHtml);

  panel.innerHTML = `
    <div class="section-head">
      <div class="badge ${s.chapter==='energy'?'energy':''}">${s.num}</div>
      <div>
        <h2>${s.title}</h2>
        <div class="obj">${s.objective}</div>
      </div>
    </div>
    <div class="annotatable" id="content-${s.id}">
      <div class="card clearfix">${introBuilt}</div>
      <div class="keypoints">
        <h3>Key points</h3>
        <ul>${s.keypoints.map(k=>`<li>${k}</li>`).join('')}</ul>
      </div>
    </div>
    <div class="practice-title">
      <h3>🧪 Practice questions</h3>
      <div class="score-pill" id="score-${s.id}">0 / ${sectionScores[s.id].total} correct</div>
    </div>
    ${questionsHtml}
    <div class="nav-buttons">
      <button id="prev-${s.id}" ${i===0?'disabled':''}>← Previous</button>
      <button class="primary" id="next-${s.id}" ${i===SECTIONS.length-1?'disabled':''}>Next topic →</button>
    </div>
  `;
  panelsEl.appendChild(panel);
});

// fill in real image sources
document.querySelectorAll('img[data-imgkey]').forEach(img=>{
  const key = img.getAttribute('data-imgkey');
  img.src = IMG[key] || '';
});

SECTIONS.forEach((s,i)=>{
  const prevBtn = document.getElementById('prev-'+s.id);
  const nextBtn = document.getElementById('next-'+s.id);
  if(prevBtn) prevBtn.onclick = ()=> showPanel(i-1);
  if(nextBtn) nextBtn.onclick = ()=> showPanel(i+1);
});

function showPanel(i){
  if(i<0||i>=SECTIONS.length) return;
  currentIndex = i;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+SECTIONS[i].id).classList.add('active');
  document.getElementById('tab-'+SECTIONS[i].id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateScorePill(sectionId){
  const sc = sectionScores[sectionId];
  document.getElementById('score-'+sectionId).textContent = `${sc.correct} / ${sc.total} correct`;
  if(sc.total>0 && sc.answered>=sc.total){
    document.getElementById('tab-'+sectionId).classList.add('done');
  }
}

function renderQuestion(sectionId, q, qi){
  const qid = sectionId+'-q'+qi;
  if(q.type==='reveal'){
    return `
      <div class="q">
        <div class="qtext"><span class="qn">Q${qi+1}.</span>${q.q}</div>
        <button class="reveal-btn" onclick="toggleReveal('${qid}')">Show model answer</button>
        <div class="reveal-box" id="${qid}-box">${q.a}</div>
      </div>`;
  }
  if(q.type==='mcq'){
    const opts = q.options.map((opt,oi)=>
      `<button class="opt" onclick="answerMCQ('${sectionId}','${qid}',${oi},${q.correct})">${opt}</button>`
    ).join('');
    return `
      <div class="q">
        <div class="qtext"><span class="qn">Q${qi+1}.</span>${q.q}</div>
        <div class="opts" id="${qid}-opts">${opts}</div>
        <div class="feedback" id="${qid}-fb"></div>
      </div>`;
  }
  if(q.type==='calc'){
    return `
      <div class="q">
        <div class="qtext"><span class="qn">Q${qi+1}.</span>${q.q}</div>
        <div class="calc-row">
          <input type="number" step="any" id="${qid}-input" placeholder="Your answer">
          <span style="font-size:0.85rem;color:var(--muted);">${q.unit||''}</span>
          <button onclick="answerCalc('${sectionId}','${qid}',${q.answer},${q.tolerance})">Check</button>
        </div>
        <div class="feedback" id="${qid}-fb"></div>
      </div>`;
  }
  if(q.type==='fillblank'){
    let idx=0;
    const qHtml = q.q.replace(/_____/g, ()=>{
      const inputId = `${qid}-b${idx}`;
      idx++;
      return `<input type="text" id="${inputId}">`;
    });
    return `
      <div class="q fill-blanks">
        <div class="qtext"><span class="qn">Q${qi+1}.</span>${qHtml}</div>
        <div class="calc-row"><button onclick="answerFill('${sectionId}','${qid}',${q.blanks.length})">Check</button></div>
        <div class="feedback" id="${qid}-fb"></div>
        <div class="reveal-box" id="${qid}-explain">${q.explain}</div>
      </div>`;
  }
  return '';
}

function toggleReveal(qid){
  document.getElementById(qid+'-box').classList.toggle('show');
}

function answerMCQ(sectionId, qid, chosen, correct){
  const opts = document.querySelectorAll('#'+qid+'-opts .opt');
  if(opts[0].disabled) return;
  opts.forEach((b,i)=>{
    b.disabled = true;
    if(i===correct) b.classList.add('correct');
    else if(i===chosen) b.classList.add('incorrect');
  });
  const q = findQuestion(sectionId, qid);
  const fb = document.getElementById(qid+'-fb');
  fb.classList.add('show');
  if(chosen===correct){
    fb.classList.add('good');
    fb.textContent = "Correct! " + q.explain;
    sectionScores[sectionId].correct++;
  } else {
    fb.classList.add('bad');
    fb.textContent = "Not quite. " + q.explain;
  }
  sectionScores[sectionId].answered++;
  updateScorePill(sectionId);
}

function answerCalc(sectionId, qid, answer, tolerance){
  const input = document.getElementById(qid+'-input');
  const val = parseFloat(input.value);
  const fb = document.getElementById(qid+'-fb');
  fb.classList.add('show');
  const q = findQuestion(sectionId, qid);
  if(isNaN(val)){
    fb.className='feedback show bad';
    fb.textContent = "Enter a number first.";
    return;
  }
  if(input.disabled) return;
  input.disabled = true;
  const btn = input.closest('.calc-row').querySelector('button');
  if(btn) btn.disabled = true;
  if(Math.abs(val-answer) <= tolerance){
    fb.className='feedback show good';
    fb.textContent = "Correct! " + q.explain;
    sectionScores[sectionId].correct++;
  } else {
    fb.className='feedback show bad';
    fb.textContent = `Not quite — the answer is ${answer} ${q.unit||''}. ${q.explain}`;
  }
  sectionScores[sectionId].answered++;
  updateScorePill(sectionId);
}

function answerFill(sectionId, qid, n){
  const q = findQuestion(sectionId, qid);
  let allCorrect = true;
  for(let i=0;i<n;i++){
    const inp = document.getElementById(`${qid}-b${i}`);
    if(inp.disabled) return;
    const val = (inp.value||'').trim().toLowerCase();
    const target = q.blanks[i].toLowerCase();
    if(val===target){
      inp.style.borderColor = 'var(--correct)';
    } else {
      inp.style.borderColor = 'var(--incorrect)';
      allCorrect = false;
    }
    inp.disabled = true;
  }
  const fb = document.getElementById(qid+'-fb');
  const box = document.getElementById(qid+'-explain');
  box.classList.add('show');
  fb.classList.add('show');
  if(allCorrect){
    fb.className='feedback show good';
    fb.textContent = "All correct!";
    sectionScores[sectionId].correct++;
  } else {
    fb.className='feedback show bad';
    fb.textContent = "Some answers weren't quite right — check the correct words below.";
  }
  sectionScores[sectionId].answered++;
  updateScorePill(sectionId);
}

function findQuestion(sectionId, qid){
  const s = SECTIONS.find(s=>s.id===sectionId);
  const qi = parseInt(qid.split('-q')[1]);
  return s.questions[qi];
}

/* ================= ANNOTATION SYSTEM ================= */
const ANNO_COLORS = [
  {name:"gold",    hex:"#c9971f"},
  {name:"amber",   hex:"#d98e2a"},
  {name:"rust",    hex:"#a44b3f"},
  {name:"olive",   hex:"#7a8a3f"},
  {name:"rose",    hex:"#b5636f"},
  {name:"umber",   hex:"#8a5a35"}
];
let annoMode = "highlight"; // or "note"
let annoColor = ANNO_COLORS[0].hex;
const STORAGE_PREFIX = "physicsGuideAnno_v1_";

// build swatches
const swatchWrap = document.getElementById('swatches');
ANNO_COLORS.forEach((c,i)=>{
  const sw = document.createElement('div');
  sw.className = 'swatch' + (i===0 ? ' active' : '');
  sw.style.background = c.hex;
  sw.title = c.name;
  sw.dataset.hex = c.hex;
  sw.onclick = ()=>{
    document.querySelectorAll('#swatches .swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    annoColor = c.hex;
  };
  swatchWrap.appendChild(sw);
});

function setMode(mode){
  annoMode = mode;
  document.getElementById('mode-highlight').classList.toggle('active', mode==='highlight');
  document.getElementById('mode-note').classList.toggle('active', mode==='note');
  document.getElementById('tool-hint').textContent = mode==='highlight' ? 'Select text to highlight' : 'Select text to add a note';
}

function saveSection(sectionId){
  const el = document.getElementById('content-'+sectionId);
  if(!el) return;
  try{
    // clone and strip heavy base64 image data before saving (images are re-attached from IMG on restore)
    const clone = el.cloneNode(true);
    clone.querySelectorAll('img[data-imgkey]').forEach(img=> img.removeAttribute('src'));
    localStorage.setItem(STORAGE_PREFIX+sectionId, clone.innerHTML);
  }catch(e){ /* storage may be unavailable (e.g. some sandboxed contexts) */ }
}

function restoreSections(){
  SECTIONS.forEach(s=>{
    try{
      const saved = localStorage.getItem(STORAGE_PREFIX+s.id);
      if(saved){
        const el = document.getElementById('content-'+s.id);
        el.innerHTML = saved;
        el.querySelectorAll('img[data-imgkey]').forEach(img=>{
          img.src = IMG[img.getAttribute('data-imgkey')] || '';
        });
      }
    }catch(e){}
  });
}

function clearAllAnnotations(){
  if(!confirm("Remove all highlights and notes on this page?")) return;
  SECTIONS.forEach(s=>{
    try{ localStorage.removeItem(STORAGE_PREFIX+s.id); }catch(e){}
  });
  location.reload();
}

function getEnclosingAnnotatable(node){
  let el = node.nodeType===3 ? node.parentElement : node;
  while(el && !el.classList.contains('annotatable')){
    el = el.parentElement;
  }
  return el;
}

document.addEventListener('mouseup', handleSelectionEnd);
document.addEventListener('touchend', handleSelectionEnd);

function handleSelectionEnd(e){
  // don't trigger when clicking inside the toolbar
  if(e.target.closest && e.target.closest('#anno-toolbar')) return;
  setTimeout(()=>{
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    const text = sel.toString();
    if(!text.trim()) return;
    const container = getEnclosingAnnotatable(range.commonAncestorContainer);
    if(!container) return; // selection wasn't inside an annotatable block

    if(annoMode === 'highlight'){
      applyHighlight(range, annoColor);
    } else {
      applyNote(range, annoColor);
    }
    sel.removeAllRanges();
    const sectionId = container.id.replace('content-','');
    saveSection(sectionId);
  }, 10);
}

function applyHighlight(range, hex){
  const mark = document.createElement('mark');
  mark.className = 'hl';
  mark.style.backgroundColor = hexToRgba(hex, 0.38);
  mark.title = 'Click to remove highlight';
  mark.onclick = function(ev){
    ev.stopPropagation();
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    const container = getEnclosingAnnotatable(parent);
    if(container) saveSection(container.id.replace('content-',''));
  };
  try{
    range.surroundContents(mark);
  }catch(err){
    // range spans multiple elements; fall back to extracting contents
    const frag = range.extractContents();
    mark.appendChild(frag);
    range.insertNode(mark);
  }
}

function applyNote(range, hex){
  const noteText = prompt("Add your note:");
  if(noteText===null || noteText.trim()==='') return;
  const span = document.createElement('span');
  span.className = 'note-anno';
  span.style.borderColor = hex;
  span.style.backgroundColor = hexToRgba(hex, 0.14);
  span.dataset.note = noteText;
  span.title = noteText;
  span.onclick = function(ev){
    ev.stopPropagation();
    const action = prompt("Edit note (leave blank to delete):", span.dataset.note);
    const container = getEnclosingAnnotatable(span);
    if(action===null) return;
    if(action.trim()===''){
      const parent = span.parentNode;
      while(span.firstChild) parent.insertBefore(span.firstChild, span);
      parent.removeChild(span);
    } else {
      span.dataset.note = action;
      span.title = action;
    }
    if(container) saveSection(container.id.replace('content-',''));
  };
  try{
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }catch(err){ /* ignore malformed ranges */ }
}

function hexToRgba(hex, alpha){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// re-attach click handlers to restored marks/notes (since innerHTML restore loses bound JS handlers)
function rebindAnnotations(){
  document.querySelectorAll('.annotatable mark.hl').forEach(mark=>{
    mark.onclick = function(ev){
      ev.stopPropagation();
      const parent = mark.parentNode;
      while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      const container = getEnclosingAnnotatable(parent);
      if(container) saveSection(container.id.replace('content-',''));
    };
  });
  document.querySelectorAll('.annotatable span.note-anno').forEach(span=>{
    span.onclick = function(ev){
      ev.stopPropagation();
      const action = prompt("Edit note (leave blank to delete):", span.dataset.note || '');
      const container = getEnclosingAnnotatable(span);
      if(action===null) return;
      if(action.trim()===''){
        const parent = span.parentNode;
        while(span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
      } else {
        span.dataset.note = action;
        span.title = action;
      }
      if(container) saveSection(container.id.replace('content-',''));
    };
  });
}

restoreSections();
rebindAnnotations();
</script>
